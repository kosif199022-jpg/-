name: ALTAREEQ MCP CI
on:
  push:
    branches: ['codex/altareeq-cloudflare-mcp']
    paths: ['apps/mcp/**', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['apps/mcp/**', '.github/workflows/mcp.yml']
permissions:
  contents: read
concurrency:
  group: altareeq-mcp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mcp-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Reject committed secrets
        working-directory: .
        run: |
          test -z "$(find apps/mcp -type f \( -name '.env' -o -name '.dev.vars' -o -name '*.pem' -o -name '*.key' \) -print -quit)"
          ! grep -RIE --exclude='README.md' --exclude='*.md' '(api[_-]?token|client[_-]?secret|cookie[_-]?encryption[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'][A-Za-z0-9_./+=-]{12,}' apps/mcp
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run types
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm run deploy:dry-run
